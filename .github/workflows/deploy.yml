name: Deploy

on:
  push:
    branches: [master]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy-frontend:
    needs: test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install and build
        run: |
          npm install
          npm run build
          npm run bundle

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SOURCE: frontend/dist/
          TARGET: ${{ secrets.FRONTEND_DEPLOY_TARGET }}
          ARGS: "-rltgoDzvO --delete"
          SCRIPT_BEFORE: mkdir -p ${{ secrets.FRONTEND_DEPLOY_TARGET }}

  deploy-backend:
    needs: test
    runs-on: ubuntu-latest

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PW: ${{ secrets.DB_PW }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_NAME: ${{ secrets.DB_NAME }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      PORT: ${{ secrets.PORT }}
      NODE_ENV: production
      SEQUELIZE_SYNC_ALTER: ${{ secrets.SEQUELIZE_SYNC_ALTER }}

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Create production .env
        run: |
          if [ -z "$DB_PW" ]; then
            echo "::error::DB_PW is empty. Add a repository secret named DB_PW."
            exit 1
          fi
          # printf avoids shell expansion issues with special chars in passwords
          : > .env
          printf 'DB_HOST=%s\n' "$DB_HOST" >> .env
          printf 'DB_PW=%s\n' "$DB_PW" >> .env
          printf 'DB_USER=%s\n' "$DB_USER" >> .env
          printf 'DB_NAME=%s\n' "$DB_NAME" >> .env
          printf 'AUTH_SECRET=%s\n' "$AUTH_SECRET" >> .env
          printf 'PORT=%s\n' "$PORT" >> .env
          printf 'NODE_ENV=%s\n' "$NODE_ENV" >> .env
          printf 'SEQUELIZE_SYNC_ALTER=%s\n' "$SEQUELIZE_SYNC_ALTER" >> .env
          # Confirm key is present without printing the secret value
          grep -q '^DB_PW=.\+' .env || { echo "::error::DB_PW line missing or empty in .env"; exit 1; }

      - name: Bundle deploy folder
        run: |
          npm run bundle
          cp -f .env deploy/.env
          grep -q '^DB_PW=.\+' deploy/.env || { echo "::error::deploy/.env missing DB_PW"; exit 1; }
          ls -la deploy/

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: backend/deploy/
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.BACKEND_DEPLOY_TARGET }}
          SCRIPT_BEFORE: mkdir -p ${{ secrets.BACKEND_DEPLOY_TARGET }}

      - name: Restart API service on server
        uses: JimCronqvist/action-ssh@master
        with:
          hosts: "${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}"
          privateKey: ${{ secrets.SERVER_SSH_KEY }}
          debug: false
          command: |
            cd ${{ secrets.BACKEND_DEPLOY_TARGET }}
            npm install --omit=dev
            sudo systemctl stop trips-backend
            sudo cp trips-backend.service /lib/systemd/system/trips-backend.service
            sudo systemctl daemon-reload
            sudo systemctl start trips-backend
